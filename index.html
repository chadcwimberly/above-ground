<!doctype html>
<html lang="en" data-palette="hearth" data-font="lora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8c6b2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Above Ground</title>
<meta name="description" content="Calm, research-based exercises for anxiety, low mood and grounding. Free, with no ads and no account needed.">
<link rel="canonical" href="https://aboveground.app/">
<meta property="og:title" content="Above Ground">
<meta property="og:description" content="Calm, research-based exercises for anxiety, low mood and grounding. Free, with no ads.">
<meta property="og:url" content="https://aboveground.app/">
<meta property="og:type" content="website">
<style>
/* Themes (saved as "palette"): Hearth (default, warm browns), Moss, Tide, Pine (bright), Dusk (dark) */
:root{--radius:1rem;--btn-font:1.1rem;--btn-py:.7rem;--btn-px:1.2rem;--bg:#d8c6b2;--surface:#e5d7c6;--ink:#3a2b21;--mute:#5f4a39;--accent:#6f4a33;--on:#f6ece1;--font:'Lora',Georgia,serif}
[data-palette=moss]{--bg:#cfd6c8;--surface:#dde3d6;--ink:#2b3328;--mute:#4f5d4c;--accent:#4f6b50;--on:#f4f7f1}
[data-palette=tide]{--bg:#cdd8de;--surface:#dbe4e9;--ink:#23323b;--mute:#46596a;--accent:#3f6477;--on:#f2f7fa}
[data-palette=pine]{--bg:#1f2a27;--surface:#2a3733;--ink:#dfe8e3;--mute:#9bb0a6;--accent:#8fb8a3;--on:#1b2421}
[data-palette=dusk]{--bg:#2b2830;--surface:#37333d;--ink:#e6e1ea;--mute:#a39cac;--accent:#b9a7c9;--on:#25222b}
[data-font=source]{--font:'Source Sans 3',system-ui,sans-serif}
[data-font=alegreya]{--font:'Alegreya Sans',system-ui,sans-serif}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1.125rem/1.55 var(--font)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

#app{display:flex;flex-direction:column;height:100dvh;max-width:32rem;margin:0 auto;
  /* Capacitor sets --safe-area-inset-* on Android web views where env() is unreliable; elsewhere env() is used */
  padding:var(--safe-area-inset-top,env(safe-area-inset-top)) var(--safe-area-inset-right,env(safe-area-inset-right))
    var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) var(--safe-area-inset-left,env(safe-area-inset-left))}
header{position:relative;z-index:1;display:flex;justify-content:space-between;padding:.75rem 1rem}
.icon,.tool{display:grid;place-items:center;width:2.75rem;height:2.75rem;border:0;border-radius:50%;background:transparent}
.tool{width:3.25rem;height:3.25rem;background:var(--surface)}
.tool[aria-pressed=true]{background:var(--accent);color:var(--on)}
svg{width:1.4rem;height:1.4rem}
.flip svg{transform:scaleY(-1)}

main{flex:1;overflow:auto;padding:1rem 1.75rem;display:flex;flex-direction:column;isolation:isolate}
main.center{justify-content:center;text-align:center}
main.has-blob{overflow:visible}
.screen{animation:fade .35s ease}
h1{font-size:1.8rem;font-weight:500;line-height:1.2;margin:0 0 .75rem}
ol{padding-left:1.3rem;margin:.5rem 0}
li{margin:.7rem 0;padding-left:.2rem}
input{width:100%;padding:.8rem 1rem;margin-bottom:.6rem;border-radius:var(--radius);background:var(--surface);
  border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.aff,.msg{font-size:2rem;line-height:1.3}
.lead{font-size:1.15rem;color:var(--mute);margin:0 0 1.25rem}
.aff p{margin:.4rem 0}
.aff .how{font-size:1.15rem;line-height:1.5;color:var(--mute);margin-top:1rem}
.msg{font-size:1.75rem;margin:0}

/* Affirmation: text sits on a floating, breathing, hand-drawn circle centered on the screen */
.screen.said-on-blob{position:relative;--d:max(16rem,min(calc(100vw - 1.5rem),28rem,calc(100dvh - 12rem)))}
.said{position:relative;z-index:1;max-width:calc(var(--d) * .64);margin:0 auto}
.said .aff{font-size:clamp(1.5rem,calc(var(--d) * .068),2rem)}
.said .aff .how{font-size:clamp(1rem,calc(var(--d) * .04),1.15rem)}
.blob{position:absolute;z-index:0;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);pointer-events:none}
.blob .float{width:100%;height:100%;animation:float 14s ease-in-out infinite}
.blob .breathe{width:100%;height:100%;animation:breathe 9s ease-in-out infinite}
.blob svg{display:block;width:100%;height:100%;overflow:visible}
.blob path{fill:var(--surface)}
.blob .halo{opacity:.5;transform-origin:center;animation:spin 70s linear infinite reverse}
.blob .core{transform-origin:center;animation:spin 90s linear infinite}

/* Welcome: greeting + three "what do you need" choices */
.welcome h1{font-size:2rem;margin:0 0 2rem}
.needs{display:flex;flex-direction:column;gap:.9rem;text-align:left}
.need{width:100%;min-height:4rem;padding:.9rem 1.4rem;border:0;border-radius:var(--radius);background:var(--surface);font-size:1.25rem;font-weight:500}
.need:active{background:var(--accent);color:var(--on)}
main[aria-busy=true]{opacity:.6;transition:opacity .2s}

footer{position:relative;z-index:1;padding:.5rem 1.5rem 1.25rem}
footer:empty{padding:0}
.tools{display:flex;justify-content:center;gap:.9rem;margin-bottom:1rem}
.cta{width:100%;min-height:4.25rem;border:0;border-radius:var(--radius);background:var(--accent);color:var(--on);font-size:1.4rem;font-weight:500}
.soft{margin-top:.75rem;padding:var(--btn-py) var(--btn-px);border-radius:var(--radius);background:transparent;border:1px solid var(--accent);font-size:var(--btn-font)}
footer .soft{display:block;margin:.75rem auto 0}

/* Settings and "Need more help?" open as a centered modal with an X in the corner. Inside it, buttons use the
   smaller menu size (the --btn-* tokens); every text button app-wide shares --radius, icon buttons are circles. */
dialog{margin:auto;width:calc(100% - 2rem);max-width:30rem;border:0;border-radius:1.5rem;padding:0;overflow:hidden;
  background:var(--surface);color:var(--ink);box-shadow:0 1.5rem 3rem rgb(0 0 0/.25);
  --btn-font:.95rem;--btn-py:.45rem;--btn-px:.85rem}
dialog .x{position:absolute;top:.6rem;right:.6rem;z-index:1;background:var(--surface)}
dialog .x:hover{background:var(--bg)}
dialog::backdrop{background:rgb(0 0 0/.35)}
.body{padding:1.25rem 1.5rem 1.5rem;overflow-y:auto;overscroll-behavior:contain;
  max-height:calc(100dvh - 2rem - var(--safe-area-inset-top,env(safe-area-inset-top)) - var(--safe-area-inset-bottom,env(safe-area-inset-bottom)))}
.body>:first-child{margin-top:0;padding-right:2.5rem}
h2{font-size:1.1rem;font-weight:500;margin:1rem 0 .5rem;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:.6rem}
.opt{--pl:.5rem;display:flex;align-items:center;gap:.5rem;padding:var(--btn-py) var(--btn-px) var(--btn-py) var(--pl);border-radius:var(--radius);background:transparent;font-size:var(--btn-font);
  border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.opt.text{--pl:var(--btn-px)} /* no swatch: equal padding left and right */
.opt[aria-pressed=true]{border:2px solid var(--accent);padding:calc(var(--btn-py) - 1px) calc(var(--btn-px) - 1px) calc(var(--btn-py) - 1px) calc(var(--pl) - 1px)}
/* Swatch: fixed square box so it stays a true circle; the ring is drawn on top of the colors so they can't clip it */
.sw{flex:none;box-sizing:border-box;width:1.25rem;height:1.25rem;border-radius:50%;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.small{font-size:.9rem;color:var(--mute);margin:1rem 0 .75rem}

/* "Need more help?": a quiet link in the header, always there */
header{align-items:center}
.help-link{border:0;background:transparent;color:var(--mute);font-size:.9rem;padding:.6rem .5rem;min-height:2.75rem;text-decoration:underline;text-underline-offset:3px}
.link{border:0;background:transparent;color:inherit;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.help-title{font-size:1.35rem;margin:.25rem 0 .5rem}
.help-title:focus{outline:none}
.line{background:var(--bg);border-radius:1.25rem;padding:1rem 1.1rem;margin:.9rem 0}
.line .name{font-weight:500;margin:0 0 .25rem}
.line p{margin:0 0 .5rem}
.ways{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
.ways a{display:grid;place-items:center;text-decoration:none;text-align:center}
.ways .cta{min-height:2.9rem;font-size:calc(var(--btn-font) * 1.1)}
.ways .soft{margin:0;color:var(--ink)}
.country select{margin-left:.35rem;padding:.4rem .6rem;border-radius:.6rem;background:var(--bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);font:inherit}

/* Reminders */
.remind{display:flex;flex-direction:column;gap:.75rem;margin-top:.75rem}
.remind input{width:auto;margin:0 0 0 .5rem;padding:.5rem .75rem}
.days{display:flex;gap:.35rem;flex-wrap:wrap}
.day{--pl:0;min-width:2.75rem;min-height:2.75rem;justify-content:center;padding:0}
.opt.day[aria-pressed=true]{padding:0}

/* "Why this works" and its sources */
.why{margin:1.5rem 0 .5rem;padding:.9rem 1.1rem;border-radius:1.25rem;background:var(--surface)}
.why summary{cursor:pointer;font-weight:500;min-height:1.75rem}
.why p{margin:.75rem 0 .5rem;font-size:1rem}
.sources{margin:0;padding-left:1.1rem;font-size:.9rem;color:var(--mute)}
.sources li{margin:.35rem 0}
.sources a{color:inherit}

/* Breathing guide: the circle grows on "in" and shrinks on "out" over each phase's seconds */
.pacer{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin:1.25rem 0 .5rem}
.pacer[hidden]{display:none}
.breath{width:9rem;height:9rem;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:scale(.55);
  transition-property:transform;transition-timing-function:ease-in-out}
.breath[data-m=in]{transform:scale(1)}
.phase{margin:0;font-size:1.25rem;font-weight:500;min-height:1.6em}
@media (prefers-reduced-motion:reduce){.breath{display:none}}

/* Visually hidden, still read by screen readers */
.tight{margin:.25rem 0 .75rem}
.small a{color:inherit;text-underline-offset:.15em}
.back-link{display:inline-block;margin-bottom:.5rem;font-size:.95rem;color:var(--mute)}
.sub-title{font-size:1.4rem;font-weight:500;margin:.25rem 0 .75rem;outline:none}
.secret{display:grid;gap:1rem;justify-items:center;margin:.5rem 0 .25rem}
.secret[data-hidden] .code,.secret[data-hidden] .qr{filter:blur(7px);user-select:none;pointer-events:none}
.codebox{width:100%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:var(--radius);background:var(--bg);padding:.6rem .6rem .35rem}
.code{display:block;width:100%;min-height:6.5rem;resize:vertical;border:0;background:transparent;color:var(--ink);font:500 1.05rem/1.55 var(--font);padding:.2rem .3rem;transition:filter .3s}
.code:focus{outline:none}.codebox:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.code-meta{display:flex;justify-content:space-between;align-items:center;min-height:2.75rem;font-size:.85rem;color:var(--mute);padding-left:.3rem}
.code-meta .warn{color:inherit;font-weight:600}
.copy{width:2.5rem;height:2.5rem;margin-left:auto}.copy.done{color:var(--accent)}
.qr{width:12rem;max-width:70%;padding:.6rem;border-radius:var(--radius);background:#f6efe6;transition:filter .3s}.qr svg{display:block;width:100%;height:auto}
.devices{list-style:none;padding:0;margin:.25rem 0 1rem}
.devices li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.devices em{color:var(--mute);font-style:normal;font-size:.9rem}
.scan{margin:.75rem 0}.scan video{display:block;width:100%;max-height:16rem;object-fit:cover;border-radius:1rem;background:#000;margin-bottom:.5rem}
.danger{border-color:#a3412f;color:inherit}
[data-palette=pine] .danger,[data-palette=dusk] .danger{border-color:#e08a78}
.costs{margin:.25rem 0 1rem}.costs div{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.costs dt{color:var(--ink)}.costs dd{margin:0;color:var(--mute);text-align:right}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.5rem 0 1rem}
.tip{min-height:2.9rem;border:0;border-radius:var(--radius);background:var(--accent);color:var(--on);font-size:calc(var(--btn-font) * 1.15);font-weight:500}
.thanks{font-size:1.2rem;background:var(--bg);border-radius:1.25rem;padding:1rem 1.1rem;outline:none}
.tipcard{margin-top:2rem;padding:1.1rem 1.2rem;border-radius:1.5rem;background:var(--surface);text-align:center}
.tipcard p{margin:0 0 .25rem;font-size:1.05rem}
.tipcard-more{display:flex;justify-content:center;gap:1.5rem;margin-top:.9rem;font-size:.95rem;color:var(--mute)}
.update{position:fixed;left:50%;bottom:calc(1rem + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)));transform:translateX(-50%);
  width:calc(100% - 2rem);max-width:30rem;display:flex;align-items:center;gap:.75rem;padding:.8rem .8rem .8rem 1.2rem;
  border-radius:1.25rem;background:var(--surface);color:var(--ink);box-shadow:0 .4rem 1.5rem color-mix(in srgb,var(--ink) 25%,transparent);
  animation:bar-in .45s var(--ease-out);z-index:10}
.update[hidden]{display:none}
.update p{margin:0;flex:1;font-size:1rem;line-height:1.35}
.update button{border:0;border-radius:var(--radius);padding:.6rem 1rem;background:var(--accent);color:var(--on);font-weight:500;white-space:nowrap}
.update .later{background:transparent;color:var(--ink);padding:.6rem .5rem}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Motion. Gentle and quick; all of it is off when the system's "reduce motion" setting is on (see the end). */
:root{--ease-out:cubic-bezier(.22,1,.36,1)}
body,dialog,.need,.tool,.line,.why,.tipcard{transition:background-color .45s ease,color .45s ease}
/* Screens: the main area and its footer slide between screens while the header stays still (View Transitions where
   the browser has them; elsewhere each screen rises in). */
#main{view-transition-name:screen}#foot{view-transition-name:foot}
.screen{animation:rise .45s var(--ease-out) both}
.vt .screen{animation:none}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(screen),::view-transition-group(foot){animation-duration:.42s;animation-timing-function:var(--ease-out)}
::view-transition-old(screen){animation:.16s ease-in both slide-out}
::view-transition-new(screen){animation:.4s var(--ease-out) .11s both slide-in}
[data-dir=back]::view-transition-old(screen){animation-name:slide-out-back}
[data-dir=back]::view-transition-new(screen){animation-name:slide-in-back}
[data-dir=same]::view-transition-old(screen){animation-name:fade-out}
[data-dir=same]::view-transition-new(screen){animation-name:rise}
::view-transition-old(foot){animation:.18s ease both fade-out}
::view-transition-new(foot){animation:.35s ease .08s both fade}
.needs .need{animation:rise .5s var(--ease-out) both}
.needs .need:nth-child(2){animation-delay:.06s}.needs .need:nth-child(3){animation-delay:.12s}
/* Buttons give a little under the finger */
.need,.cta,.soft,.opt,.tool,.tip,.icon{transition:transform .16s var(--ease-out),background-color .3s ease,color .3s ease,border-color .3s ease}
.need:active,.cta:active,.soft:active,.opt:active,.tool:active,.tip:active,.icon:active{transform:scale(.96)}
.tool[aria-pressed=true]{animation:pop .4s var(--ease-out)}
/* Settings and "Need more help?" fade and grow in; the dimmed background fades */
dialog{transition:transform .3s var(--ease-out),opacity .25s ease,background-color .45s ease,overlay .3s allow-discrete,display .3s allow-discrete}
dialog:not([open]){transform:scale(.96);opacity:0}
@starting-style{dialog[open]{transform:scale(.96);opacity:0}}
dialog::backdrop{background:rgb(0 0 0/0);transition:background-color .4s ease,overlay .4s allow-discrete,display .4s allow-discrete}
dialog[open]::backdrop{background:rgb(0 0 0/.35)}
@starting-style{dialog[open]::backdrop{background:rgb(0 0 0/0)}}
/* Moving between Settings pages */
.body.enter-fwd{animation:slide-in .32s var(--ease-out)}
.body.enter-back{animation:slide-in-back .32s var(--ease-out)}
.line{animation:rise .45s var(--ease-out) both}
.line:nth-of-type(2){animation-delay:.06s}.line:nth-of-type(3){animation-delay:.12s}
/* "Why this works" opens smoothly where the browser can animate it */
.why{interpolate-size:allow-keywords}
.why::details-content{block-size:0;overflow:hidden;transition:block-size .35s var(--ease-out),content-visibility .35s allow-discrete}
.why[open]::details-content{block-size:auto}
.why[open] p,.why[open] .sources{animation:fade .4s ease .05s both}
.tipcard{animation:rise .55s var(--ease-out) .4s both}
.thanks{animation:pop-in .5s var(--ease-out) both}
.pacer:not([hidden]){animation:fade .4s ease}
#join-act,.secret{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade-out{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(.75rem)}to{opacity:1;transform:none}}
@keyframes slide-in{from{opacity:0;transform:translateX(1.5rem)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-1rem)}}
@keyframes slide-in-back{from{opacity:0;transform:translateX(-1.5rem)}}
@keyframes slide-out-back{to{opacity:0;transform:translateX(1rem)}}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes pop-in{from{opacity:0;transform:scale(.94)}}
@keyframes bar-in{from{opacity:0;transform:translate(-50%,1rem)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes float{25%{transform:translate(.4rem,-.5rem)}50%{transform:translate(-.2rem,-.9rem)}75%{transform:translate(-.5rem,-.2rem)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::backdrop,*::details-content{animation:none!important;transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="back" data-a="back" aria-label="Back"></button>
    <button class="help-link" data-a="help">Need more help?</button>
    <button class="icon" id="gear" data-a="settings" aria-label="Settings"></button>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<dialog id="settings" aria-label="Settings"><button class="icon x" data-close aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="body"></div></dialog>
<dialog id="help" aria-label="Need more help?"><button class="icon x" data-close aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="body"></div></dialog>
<div id="update" class="update" role="region" aria-label="Update available" hidden>
  <p>A new version of Above Ground is ready.</p>
  <button class="later" data-update="later">Later</button>
  <button data-update="refresh">Refresh</button>
</div>
<p id="sr" class="sr" aria-live="polite"></p>

<script type="module" src="/src/main.js"></script>
</body>
</html>
