# When a pull request is merged or closed, remove its preview APK prerelease (pr-N).
name: Remove preview build

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "pr-${{ github.event.number }}" --cleanup-tag --yes -R "${{ github.repository }}" || echo "No preview release to remove"
