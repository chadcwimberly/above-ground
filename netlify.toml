# The website. `npm run build` stamps public/version.json (version + release time), gives the service worker a
# per-release cache name, then Vite builds the app into dist/, which Netlify serves.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Always revalidate the service worker and version file so new releases roll out promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# Vite gives built files content-hashed names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sync links (https://aboveground.app/sync#word-word-...) open the app; the words after # never reach the server.
[[redirects]]
  from = "/sync"
  to = "/index.html"
  status = 200
